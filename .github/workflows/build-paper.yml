name: Build Paper PDF

on:
  push:
    paths:
      - 'paper/**'
  pull_request:
    paths:
      - 'paper/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper
          root_file: SynBADD.tex
          latexmk_use_lualatex: false
          pre_compile: latex elsarticle.ins && latexmk -C SynBADD.tex
          args: -pdf -interaction=nonstopmode -file-line-error -halt-on-error

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: SynBADD-paper
          path: paper/SynBADD.pdf
          retention-days: 30
